[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-path-lab"
version = "1.0.0"
description = "Compare pathfinding algorithms on grids: nodes expanded, path cost and a rendered map."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ABU BAKAR SIDDIQUE", email = "abs2003.edu@gmail.com" }]
keywords = ["pathfinding", "algorithms", "astar", "dijkstra", "visualisation"]
dependencies = []

[project.scripts]
graph-path = "graph_path_lab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
